[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "matt"
version = "0.2.0"
description = "MATT — Mail Analysis and Triage Tool"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "MATT Contributors" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Communications :: Email",
]

dependencies = [
    "charset-normalizer>=3.0",
    "python-dateutil>=2.8",
    "pytz",
    "rich>=13.0",
]

[project.optional-dependencies]
office = ["olefile>=0.46", "oletools>=0.60"]
# Prefer pypdf (the maintained fork) over the deprecated PyPDF2.
# PDFAnalyzer prefers pypdf at import time and falls back to PyPDF2
# only when pypdf isn't available, so existing PyPDF2-pinned environments
# still work.
pdf = ["pypdf>=5.0", "pdf2image"]
html = ["justhtml>=1.0"]
msg = ["extract-msg"]
7z = ["py7zr"]
lang = ["lingua-language-detector>=2.0"]
mime = ["python-magic", "magika"]
tui = ["textual>=0.40"]
# Fuzzy hashing — split because ssdeep fails to build on newer
# setuptools (pkg_resources unbundling); tlsh is the modern peer and
# what `all` pulls in by default.
fuzzy = ["py-tlsh"]
fuzzy-ssdeep = ["ssdeep"]
yara = ["yara-python"]
js = ["jsbeautifier>=1.14"]
qr = ["pyzbar"]
# RARAnalyzer needs both the rarfile pip wrapper AND the `unrar` system
# binary (license-encumbered, not redistributed). Setting `extra = "rar"`
# in the analyzer made ``matt --check`` advertise ``pip install .[rar]``;
# this entry makes that command actually work for the Python side.
rar = ["rarfile"]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
]
all = [
    "matt[office,pdf,html,msg,7z,lang,mime,fuzzy,tui,yara,js,qr,rar]",
]

[project.scripts]
matt = "matt:main"

[tool.setuptools]
py-modules = [
    "matt",
    "structure",
    "reporting",
    "eml",
    "attest",
    "getallfromfields",
    "mail2timeline",
    "mailattachments",
    "maildump",
    "mailexport",
    "mailfrom",
    "mailheader",
]

[tool.setuptools.packages.find]
include = ["Analyzers*", "Config*", "Utils*", "renderers*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Marker registry — `docker` tests detonate attacker-controlled bytes
# through external sandboxes (box-js etc.) and only run inside the
# MATT container (set MATT_IN_DOCKER=1). They are deselected by
# default; use `-m docker` to opt in (or `make test-dynamic`).
markers = [
    "docker: requires running inside the MATT Docker image (MATT_IN_DOCKER=1) — exercises box-js, libzbar, dynamic JS sandbox",
]
addopts = "-m 'not docker'"
# Quiet 3rd-party deprecation noise that floods the test output and
# isn't actionable from the project: oletools imports pyparsing
# patterns deprecated in pyparsing >=3.0; pypdf ships a transitional
# shim warning. Filter by *module* so genuine project warnings are
# still visible.
filterwarnings = [
    "ignore::DeprecationWarning:oletools.*",
    "ignore::DeprecationWarning:PyPDF2.*",
    "ignore:.*pyparsing.*:DeprecationWarning",
]
